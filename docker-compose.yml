services:
  guardian:
    build:
      context: .
      platforms:
        - linux/arm64
        - linux/amd64
    image: wpkn-liquidity-guardian:latest
    container_name: wpkn-guardian
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - guardian-data:/app/data
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  guardian-data:
